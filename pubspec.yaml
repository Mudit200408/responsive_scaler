name: responsive_scaler
description: A Flutter package for consistent responsive scaling of text, icons, and spacing based on screen size, helping maintain UI proportionality across devices.
version: 1.0.0
homepage: https://github.com/Mudit200408/responsive_scaler
repository: https://github.com/Mudit200408/responsive_scaler
issue_tracker: https://github.com/Mudit200408/responsive_scaler/issues
publish_to: https://pub.dev

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

topics:
  - responsive
  - ui
  - scaling
  - text
  - material-design

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Flutter section is not needed for packages unless you have assets